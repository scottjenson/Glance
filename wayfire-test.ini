# Minimal Wayfire config for testing edge-shrink in a nested window.
# Run with:  wayfire -c ~/WideMonitorUX/wayfire-test.ini

[core]
plugins = \
  autostart \
  command \
  move \
  resize \
  place \
  /home/scottjenson/WideMonitorUX/build/libedgeshrink.so

[move]
# Alt+drag anywhere in a window moves it (KDE grabs the Meta/Super key).
# Dragging by the title bar works too.
activate = <alt> BTN_LEFT
# Turn off edge snapping so it doesn't fight with the shrink effect.
enable_snap = false

[resize]
activate = <alt> BTN_RIGHT

[command]
# Alt+Enter opens another terminal inside the nested session.
binding_terminal = <alt> KEY_ENTER
command_terminal = konsole

[autostart]
autostart_wf_shell = false
terminal = konsole

[output:WL-1]
# The VM uses the Mac's full Retina resolution with KDE at 100% scale, so the
# nested session draws at 2x itself: sharp, and normal size inside the window.
# (Nested Wayfire can't tell KDE it is 2x, so KDE at 200% would double it.)
# 2560x1440 real pixels = 1280x720 at scale 2.
mode = 2560x1440
scale = 2
